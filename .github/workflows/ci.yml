name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Generate test coverage
        if: matrix.node-version == '20.x'
        run: npm run test:coverage || echo "Coverage generation failed, continuing..."

      - name: Upload coverage reports
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-soundweave
          fail_ci_if_error: false
        continue-on-error: true

  build:
    name: Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify imports and syntax
        run: node --check src/index.js

      - name: Check for syntax errors in all files
        run: |
          find src cli -name "*.js" -exec node --check {} \;

      - name: Validate package.json
        run: npm pkg fix --dry-run

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test CLI tool
        run: |
          node cli/musicgen-cli.js --help
          node cli/musicgen-cli.js models || echo "Models command requires API token, skipping"

      - name: Test examples syntax
        run: |
          node --check examples/basic-usage.js
          node --check examples/batch-generation.js
          node --check examples/integration-neuralmix.js
          node --check examples/integration-utqueantlaxis.js

      - name: Verify configuration validation
        run: |
          node -e "import('./src/config/environment.js').then(m => console.log('✅ Config loaded'))"
        env:
          NODE_ENV: test
